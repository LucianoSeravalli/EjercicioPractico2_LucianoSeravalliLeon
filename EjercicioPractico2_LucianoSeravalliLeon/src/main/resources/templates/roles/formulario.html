<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentosGeneral :: head('Formulario de rol')}"></head>
<body>

<header th:replace="~{general/fragmentosGeneral :: header}"></header>

<main class="container my-5">
    <div class="mb-4">
        <h2 class="section-title" th:text="${rol.id == null ? 'Nuevo Rol' : 'Editar Rol'}"></h2>
        <p class="section-subtitle">
            Complete la información del rol.
        </p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="form-card">
                <form th:action="@{/roles/guardar}" th:object="${rol}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-4">
                        <label class="form-label">Nombre del rol</label>
                        <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ingrese el nombre del rol" required>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-principal">
                            <i class="bi bi-save-fill me-1"></i> Guardar
                        </button>
                        <a th:href="@{/roles}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left-circle me-1"></i> Volver
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{general/fragmentosGeneral :: footer}"></footer>
<div th:replace="~{general/fragmentosGeneral :: scripts}"></div>

</body>
</html>
