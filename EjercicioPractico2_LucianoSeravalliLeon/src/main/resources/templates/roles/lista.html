<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentosGeneral :: head('Gestión de roles')}"></head>
<body>

<header th:replace="~{general/fragmentosGeneral :: header}"></header>

<main class="container my-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
        <div>
            <h2 class="section-title mb-1">Gestión de Roles</h2>
            <p class="section-subtitle mb-0">
                Administra los roles disponibles dentro del sistema.
            </p>
        </div>
        <div class="mt-3 mt-md-0">
            <a th:href="@{/roles/nuevo}" class="btn btn-principal">
                <i class="bi bi-plus-circle-fill me-1"></i> Nuevo rol
            </a>
        </div>
    </div>

    <div class="tabla-personalizada">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre del rol</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rol : ${roles}">
                    <td th:text="${rol.id}"></td>
                    <td th:text="${rol.nombre}"></td>
                    <td class="text-center">
                        <a th:href="@{/roles/editar/{id}(id=${rol.id})}" class="btn btn-sm btn-outline-warning me-1">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                        <a th:href="@{/roles/eliminar/{id}(id=${rol.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Desea eliminar este rol?');">
                            <i class="bi bi-trash-fill"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(roles)}">
                    <td colspan="3" class="text-center py-4 text-muted">
                        No hay roles registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{general/fragmentosGeneral :: footer}"></footer>
<div th:replace="~{general/fragmentosGeneral :: scripts}"></div>

</body>
</html>
