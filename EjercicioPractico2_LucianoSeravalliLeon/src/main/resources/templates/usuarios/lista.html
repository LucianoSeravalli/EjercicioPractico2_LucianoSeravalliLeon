<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{general/fragmentosGeneral :: head('Gestión de usuarios')}"></head>
<body>

<header th:replace="~{general/fragmentosGeneral :: header}"></header>

<main class="container my-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
        <div>
            <h2 class="section-title mb-1">Gestión de Usuarios</h2>
            <p class="section-subtitle mb-0">
                Administra los usuarios registrados en la plataforma.
            </p>
        </div>
        <div class="mt-3 mt-md-0">
            <a th:href="@{/usuarios/nuevo}" class="btn btn-principal">
                <i class="bi bi-person-plus-fill me-1"></i> Nuevo usuario
            </a>
        </div>
    </div>

    <div class="form-card mb-4">
        <form th:action="@{/usuarios/buscarPorRol}" method="get">
            <div class="row align-items-end">
                <div class="col-md-8 mb-3">
                    <label class="form-label">Buscar usuarios por rol</label>
                    <select name="nombreRol" class="form-select" required>
                        <option value="">Seleccione un rol</option>
                        <option th:each="rol : ${roles}"
                                th:value="${rol.nombre}"
                                th:text="${rol.nombre}"
                                th:selected="${rol.nombre == rolSeleccionado}">
                        </option>
                    </select>
                </div>
                <div class="col-md-4 mb-3 d-flex gap-2">
                    <button type="submit" class="btn btn-principal w-100">
                        <i class="bi bi-search me-1"></i> Buscar
                    </button>
                    <a th:href="@{/usuarios}" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-arrow-clockwise me-1"></i> Limpiar
                    </a>
                </div>
            </div>
        </form>
    </div>

    <div class="tabla-personalizada">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Fecha creación</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.nombre}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td>
                        <span class="badge-rol" th:text="${usuario.rol != null ? usuario.rol.nombre : 'Sin rol'}"></span>
                    </td>
                    <td>
                        <span th:if="${usuario.ac2vo}" class="estado-activo">Activo</span>
                        <span th:unless="${usuario.ac2vo}" class="estado-inactivo">Inactivo</span>
                    </td>
                    <td th:text="${usuario.fechaCreacion}"></td>
                    <td class="text-center">
                        <a th:href="@{/usuarios/detalle/{id}(id=${usuario.id})}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-eye-fill"></i>
                        </a>
                        <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-sm btn-outline-warning me-1">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                        <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Desea eliminar este usuario?');">
                            <i class="bi bi-trash-fill"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="7" class="text-center py-4 text-muted">
                        No se encontraron usuarios para el rol seleccionado.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{general/fragmentosGeneral :: footer}"></footer>
<div th:replace="~{general/fragmentosGeneral :: scripts}"></div>

</body>
</html>
