<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentosGeneral :: head('Gestión de eventos')}"></head>
<body>

<header th:replace="~{general/fragmentosGeneral :: header}"></header>

<main class="container my-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
        <div>
            <h2 class="section-title mb-1">Gestión de Eventos</h2>
            <p class="section-subtitle mb-0">
                Consulta y administra los eventos registrados en la plataforma.
            </p>
        </div>
        <div class="mt-3 mt-md-0">
            <a th:href="@{/eventos/nuevo}" class="btn btn-principal">
                <i class="bi bi-calendar-plus-fill me-1"></i> Nuevo evento
            </a>
        </div>
    </div>

    <div class="tabla-personalizada">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Fecha</th>
                    <th>Capacidad</th>
                    <th>Estado</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="evento : ${eventos}">
                    <td th:text="${evento.id}"></td>
                    <td th:text="${evento.nombre}"></td>
                    <td th:text="${evento.descripcion}"></td>
                    <td th:text="${evento.fecha}"></td>
                    <td th:text="${evento.capacidad}"></td>
                    <td>
                        <span th:if="${evento.ac2vo}" class="estado-activo">Activo</span>
                        <span th:unless="${evento.ac2vo}" class="estado-inactivo">Inactivo</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/eventos/detalle/{id}(id=${evento.id})}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-eye-fill"></i>
                        </a>
                        <a th:href="@{/eventos/editar/{id}(id=${evento.id})}" class="btn btn-sm btn-outline-warning me-1">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                        <a th:href="@{/eventos/eliminar/{id}(id=${evento.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('¿Desea eliminar este evento?');">
                            <i class="bi bi-trash-fill"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(eventos)}">
                    <td colspan="7" class="text-center py-4 text-muted">
                        No hay eventos registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{general/fragmentosGeneral :: footer}"></footer>
<div th:replace="~{general/fragmentosGeneral :: scripts}"></div>

</body>
</html>
