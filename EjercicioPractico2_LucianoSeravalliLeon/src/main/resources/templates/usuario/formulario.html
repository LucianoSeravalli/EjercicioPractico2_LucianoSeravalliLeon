<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentosGeneral :: head('Formulario de usuario')}"></head>
<body>

<header th:replace="~{general/fragmentosGeneral :: header}"></header>

<main class="container my-5">
    <div class="mb-4">
        <h2 class="section-title" th:text="${usuario.id == null ? 'Nuevo Usuario' : 'Editar Usuario'}"></h2>
        <p class="section-subtitle">
            Complete la información correspondiente del usuario.
        </p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="form-card">
                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" placeholder="Ingrese el nombre" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="Ingrese el correo" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="text" class="form-control" th:field="*{password}" placeholder="Ingrese la contraseña" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Rol</label>
                            <select class="form-select" th:field="*{rol.id}" required>
                                <option value="">Seleccione un rol</option>
                                <option th:each="rolItem : ${roles}"
                                        th:value="${rolItem.id}"
                                        th:text="${rolItem.nombre}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Estado</label>
                        <select class="form-select" th:field="*{ac2vo}">
                            <option th:value="true">Activo</option>
                            <option th:value="false">Inactivo</option>
                        </select>
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-principal">
                            <i class="bi bi-save-fill me-1"></i> Guardar
                        </button>
                        <a th:href="@{/usuarios}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left-circle me-1"></i> Volver
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{general/fragmentosGeneral :: footer}"></footer>
<div th:replace="~{general/fragmentosGeneral :: scripts}"></div>

</body>
</html>
